<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO de base ── -->
    <title>Darni — Immobilier en Algérie | Appartements, Villas, Terrains</title>
    <meta name="description" content="Trouvez votre bien immobilier en Algérie : appartements, villas, terrains à vendre ou à louer dans les 48 wilayas. Annonces vérifiées, contact direct via WhatsApp." />
    <meta name="keywords" content="immobilier algérie, appartement vente alger, villa oran, terrain constantine, location appartement algérie, annonces immobilières dz" />
    <meta name="author" content="Darni" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://darni.app" />

    <!-- ── Open Graph ── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://darni.app" />
    <meta property="og:title"       content="Darni — Immobilier en Algérie" />
    <meta property="og:description" content="Trouvez votre bien immobilier en Algérie : appartements, villas, terrains à vendre ou à louer dans les 48 wilayas." />
    <meta property="og:image"       content="https://darni.app/og-image.jpg" />
    <meta property="og:site_name"   content="Darni" />
    <meta property="og:locale"      content="fr_DZ" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Darni — Immobilier en Algérie" />
    <meta name="twitter:description" content="Trouvez votre bien immobilier en Algérie : appartements, villas, terrains à vendre ou à louer dans les 48 wilayas." />
    <meta name="twitter:image"       content="https://darni.app/og-image.jpg" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── JSON-LD Organisation ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Darni",
      "url": "https://darni.app",
      "logo": "https://darni.app/logo.png",
      "description": "Plateforme immobilière 100% algérienne",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "DZ"
      },
      "sameAs": [
        "https://www.instagram.com/darni.app"
      ]
    }
    </script>

    <!-- ── JSON-LD WebSite avec SearchAction ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Darni",
      "url": "https://darni.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://darni.app/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ── PWA ── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1B4FD8" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
